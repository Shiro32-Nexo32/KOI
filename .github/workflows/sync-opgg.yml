name: Sync KOI accounts from OP.GG

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "data/live.json"
  schedule:
    # Offset the schedule to avoid the busiest quarter-hour boundaries.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opgg-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Sync from official OP.GG MCP
        run: node scripts/sync_opgg.mjs

      - name: Commit live data
        run: |
          if git diff --quiet -- data/live.json; then
            echo "No live-data changes."
            exit 0
          fi

          # Keep concurrent code changes safe: only carry the generated live.json
          # onto the latest main instead of pushing a stale checkout.
          cp data/live.json /tmp/koi-live.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/koi-live.json data/live.json

          if git diff --quiet -- data/live.json; then
            echo "Live data became identical after rebasing onto latest main."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.json
          git commit -m "data: sync KOI accounts from OP.GG"
          git push origin HEAD:main
