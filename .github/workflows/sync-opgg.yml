name: Sync KOI accounts from OP.GG

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opgg-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Sync OP.GG
        run: python scripts/sync_opgg.py

      - name: Commit live data
        run: |
          if git diff --quiet -- data/live.json; then
            echo "No changes in live data."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.json
          git commit -m "data: sync KOI accounts from OP.GG"
          git push origin HEAD:main
