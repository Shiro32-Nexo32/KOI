name: Sync KOI accounts from OP.GG

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "data/live.json"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: opgg-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Sync from official OP.GG MCP
        run: node scripts/sync_opgg.mjs

      - name: Commit sync snapshot
        run: |
          # Keep concurrent code changes safe: only carry the generated live.json
          # onto the latest main instead of pushing a stale checkout.
          cp data/live.json /tmp/koi-live.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/koi-live.json data/live.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.json

          if git diff --cached --quiet; then
            echo "No sync snapshot changes."
            exit 0
          fi

          git commit -m "data: sync KOI accounts from OP.GG"
          git push origin HEAD:main
