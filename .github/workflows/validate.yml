name: Validate KOI Tracker

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test Cloudflare coordinator
        run: node --test worker/tests/worker.test.mjs
      - name: Install dependencies
        run: npm install
      - name: Build frontend
        env:
          VITE_COORDINATOR_URL: https://example.invalid
        run: npx vite build
